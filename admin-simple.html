<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstroCore Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fce4d6,#e8d5f5,#d5e8f5);color:#1a1035;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#ffffff99;border:1px solid #fff;border-radius:20px;padding:20px;backdrop-filter:blur(20px);box-shadow:0 10px 35px #0000000d;margin-bottom:16px}h1{margin:0 0 5px}h2{font-size:18px;margin:0 0 14px}.muted{color:#756b82;font-size:13px}input{padding:11px 13px;border:1px solid #fff;border-radius:10px;background:#ffffffcc;width:100%;margin:6px 0}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer;background:#9333ea;color:white;font-weight:700;margin:4px 4px 4px 0}button.secondary{background:#ffffffaa;color:#1a1035;border:1px solid #ddd}button.danger{background:#ef4444}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:18px;border-radius:14px;background:#ffffff80}.num{font-size:30px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ffffffaa}.row:last-child{border-bottom:0}.hidden{display:none!important}.error{color:#dc2626;background:#fee2e2;padding:10px;border-radius:10px;font-size:13px}.ok{color:#047857;background:#d1fae5;padding:10px;border-radius:10px;font-size:13px}</style></head><body><div class="wrap">
<div id="login" class="card"><h1>AstroCore Admin</h1><p class="muted">Simple Firebase admin panel</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><button id="resetBtn" class="secondary">Reset password</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1>AstroCore Admin</h1><p id="who" class="muted"></p></div><button id="logout" class="secondary">Logout</button></div></div>
<div class="grid"><div class="stat"><div class="muted">Students</div><div id="students" class="num">0</div></div><div class="stat"><div class="muted">Materials</div><div id="materials" class="num">0</div></div><div class="stat"><div class="muted">Doubts</div><div id="doubts" class="num">0</div></div><div class="stat"><div class="muted">Folders</div><div id="folders" class="num">0</div></div></div>
<div class="card"><h2>Students</h2><div id="studentList"></div></div><div class="card"><h2>Global Doubts</h2><div id="doubtList"></div></div><div class="card"><h2>Folders</h2><input id="folderName" placeholder="New folder name"><button id="addFolder">Add folder</button><div id="folderList"></div></div>
</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import{getFirestore,collection,doc,onSnapshot,query,where,updateDoc,deleteDoc,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const ADMIN_EMAIL="207edx@gmail.com",cfg={apiKey:"AIzaSyCxnF7VFBeIhzFzUueKpW2wQGg8_wCkm58",authDomain:"school-astra.firebaseapp.com",projectId:"school-astra",storageBucket:"school-astra.firebasestorage.app"},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("loginMsg").innerHTML='<div class="error">'+esc(e.message)+'</div>'}};
$("resetBtn").onclick=async()=>{try{await sendPasswordResetEmail(auth,$("email").value.trim());$("loginMsg").innerHTML='<div class="ok">Reset email sent.</div>'}catch(e){$("loginMsg").innerHTML='<div class="error">'+esc(e.message)+'</div>'}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}if((u.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await signOut(auth);$("loginMsg").innerHTML='<div class="error">This account is not the admin account.</div>';return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=u.email;load()});
function load(){
onSnapshot(query(collection(db,"users"),where("role","==","student")),s=>{$("students").textContent=s.size;$("studentList").innerHTML=s.docs.map(d=>{let x=d.data();return'<div class="row"><span><b>'+esc(x.displayName||"Student")+'</b><br><span class="muted">'+esc(x.email||"")+'</span></span><button class="danger" onclick="removeProfile('+JSON.stringify(d.id)+')">Remove profile</button></div>'}).join("")||'<p class="muted">No students.</p>'},showError);
onSnapshot(collection(db,"materials"),s=>$("materials").textContent=s.size,showError);
onSnapshot(collection(db,"doubts"),s=>{$("doubts").textContent=s.size;$("doubtList").innerHTML=s.docs.map(d=>{let x=d.data();return'<div class="row"><span><b>'+esc(x.title||"Doubt")+'</b><br><span class="muted">'+esc(x.description||"")+'</span></span><button onclick="answer('+JSON.stringify(d.id)+')">Answer</button></div>'}).join("")||'<p class="muted">No doubts.</p>'},showError);
onSnapshot(collection(db,"folders"),s=>{$("folders").textContent=s.size;$("folderList").innerHTML=s.docs.map(d=>'<div class="row"><span>'+esc(d.data().name||d.id)+'</span><button class="danger" onclick="removeFolder('+JSON.stringify(d.id)+')">Delete</button></div>').join("")||'<p class="muted">No folders.</p>'},showError)}
window.removeProfile=async id=>{if(confirm("Remove this student's profile?"))await deleteDoc(doc(db,"users",id))};
window.removeFolder=async id=>{if(confirm("Delete this folder?"))await deleteDoc(doc(db,"folders",id))};
window.answer=async id=>{let t=prompt("Answer:");if(t!==null)await updateDoc(doc(db,"doubts",id),{answer:t,answeredAt:serverTimestamp()})};
$("addFolder").onclick=async()=>{let n=$("folderName").value.trim();if(n){await addDoc(collection(db,"folders"),{name:n,createdAt:serverTimestamp()});$("folderName").value=""}};
function showError(e){console.error(e);alert(e.message||"Action failed")}
</script></body></html>
